name: Refresh GitHub profile data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - name: Generate live GitHub graphics
        env:
          GITHUB_USERNAME: Shubhankar0199
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python scripts/radar.py
          python scripts/make_stats.py
          python scripts/cards.py
      - name: Commit changes when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: refresh GitHub profile data'; git push; fi
