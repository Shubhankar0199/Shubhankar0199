name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 1'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Shubhankar0199
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=%2339d353
            assets/snake-dark.svg?palette=github-dark&color_snake=%2339d353
      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'chore: refresh contribution snake'
          add: 'assets/snake.svg assets/snake-dark.svg'
