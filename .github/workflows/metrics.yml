name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 1'

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Shubhankar0199
          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Shubhankar0199
          base: header
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
      - uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Shubhankar0199
          base: header
          plugin_achievements: yes
          plugin_achievements_display: compact
      - uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Shubhankar0199
          base: header
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
      - name: Commit metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics-*.svg
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: refresh GitHub metrics'; git push; fi
